# /etc/nginx/sites-available/numiscan
#   sudo ln -s /etc/nginx/sites-available/numiscan /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# This is the plain HTTP config. After it works, run:
#   sudo certbot --nginx -d numiscan.example.com
# certbot rewrites this file: adds the :443 server block, the cert paths,
# and an 80 -> 443 redirect. Nothing else to do by hand.

server {
    listen 80;
    listen [::]:80;
    server_name numiscan.example.com;   # <-- your domain

    # Recognition sends base64 photos; PDF export streams back. Express allows 20 MB.
    client_max_body_size 25M;

    # The app has its own single-password login (AUTH_PASSWORD). These lines are an
    # OPTIONAL extra layer — an nginx challenge before the app is even reachable:
    #   sudo apt install apache2-utils
    #   sudo htpasswd -c /etc/nginx/.htpasswd andrii
    # auth_basic           "NumiScan";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI recognition takes 30-60 s; Numista sync is a Server-Sent-Events stream.
        proxy_read_timeout   300s;
        proxy_send_timeout   300s;
        proxy_buffering      off;
        proxy_cache          off;
        proxy_set_header Connection '';
    }
}
