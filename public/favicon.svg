<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="coinGold" cx="35%" cy="28%" r="75%">
      <stop offset="0%"   stop-color="#FBE97A"/>
      <stop offset="42%"  stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#6B4500"/>
    </radialGradient>
    <radialGradient id="coinDark" cx="38%" cy="30%" r="68%">
      <stop offset="0%"   stop-color="#1a2a40"/>
      <stop offset="100%" stop-color="#06090f"/>
    </radialGradient>
  </defs>

  <!-- Coin outer ring -->
  <circle cx="16" cy="16" r="15.5" fill="url(#coinGold)"/>

  <!-- Coin inner dark field -->
  <circle cx="16" cy="16" r="12" fill="url(#coinDark)"/>

  <!-- Inner rim lines -->
  <circle cx="16" cy="16" r="12"   fill="none" stroke="#D4AF37" stroke-width="0.5" opacity="0.45"/>
  <circle cx="16" cy="16" r="10.5" fill="none" stroke="#D4AF37" stroke-width="0.25" opacity="0.2"/>

  <!-- GEM — crown left (lit) -->
  <polygon points="11,16 16,7.5 16,13" fill="#F0C840"/>
  <!-- GEM — crown right (shadow) -->
  <polygon points="21,16 16,7.5 16,13" fill="#A87E14"/>
  <!-- GEM — crown lower-left fill -->
  <polygon points="11,16 16,13 13.5,16" fill="#D4AF37" opacity="0.65"/>
  <!-- GEM — crown lower-right fill -->
  <polygon points="21,16 16,13 18.5,16" fill="#8B6810" opacity="0.65"/>

  <!-- GEM — pavilion left (mid-tone) -->
  <polygon points="11,16 16,16 16,24" fill="#C49820"/>
  <!-- GEM — pavilion right (shadow) -->
  <polygon points="21,16 16,16 16,24" fill="#7A5500"/>

  <!-- Girdle highlight line -->
  <line x1="11" y1="16" x2="21" y2="16" stroke="#FBE97A" stroke-width="0.85" opacity="0.95"/>

  <!-- Gem outline -->
  <polygon points="11,16 16,7.5 21,16 16,24"
    fill="none" stroke="#F5D050" stroke-width="0.55" opacity="0.75"/>

  <!-- Crown sparkle (bright highlight — top-left facet) -->
  <polygon points="13.5,10.5 16,7.5 16,10.2 14.2,11.8" fill="white" opacity="0.38"/>

  <!-- Coin edge shine (arc, top-left) -->
  <path d="M 5.5,11 A 13,13 0 0,1 11,5.5"
    stroke="white" stroke-width="1.4" fill="none" opacity="0.18" stroke-linecap="round"/>
</svg>
