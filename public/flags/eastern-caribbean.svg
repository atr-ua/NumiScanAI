<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <title>Прапор Східнокарибських держав (OECS)</title>
  <defs>
    <clipPath id="oecs-circle-clip">
      <circle cx="200" cy="200" r="190"/>
    </clipPath>
  </defs>

  <!-- Зелене коло-основа -->
  <circle cx="200" cy="200" r="190" fill="#93cc45"/>

  <g clip-path="url(#oecs-circle-clip)">
    <!-- Світліший відблиск для об'єму -->
    <ellipse cx="150" cy="120" rx="170" ry="95" fill="#ffffff" opacity="0.16" transform="rotate(-25 150 120)"/>

    <!-- Орбітальне кільце: золота частина (задній/нижній бік) -->
    <path d="M 126.0 269.0 A 145 62 -18 0 1 96.7 178.6" stroke="#f9c013" stroke-width="24" fill="none" stroke-linecap="round"/>

    <!-- Орбітальне кільце: темно-синя основна дуга -->
    <path d="M 66.9 210.7 A 145 62 -18 1 1 98.0 265.5" stroke="#0a1a42" stroke-width="26" fill="none" stroke-linecap="round"/>

    <!-- Тонкий світлий відблиск на кільці -->
    <path d="M 134.8 154.9 A 145 62 -18 0 1 252.4 121.5" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.65"/>
  </g>

  <!-- Промені 8-променевої зірки -->
  <g fill="#ffffff">
    <polygon points="200.0,112.0 192.8,154.6 207.2,154.6"/>
    <polygon points="262.2,137.8 227.0,162.8 237.2,173.0"/>
    <polygon points="288.0,200.0 245.4,192.8 245.4,207.2"/>
    <polygon points="262.2,262.2 237.2,227.0 227.0,237.2"/>
    <polygon points="200.0,288.0 207.2,245.4 192.8,245.4"/>
    <polygon points="137.8,262.2 173.0,237.2 162.8,227.0"/>
    <polygon points="112.0,200.0 154.6,207.2 154.6,192.8"/>
    <polygon points="137.8,137.8 162.8,173.0 173.0,162.8"/>
  </g>

  <!-- Жовтогарячий диск у центрі з тонким зеленим обідком -->
  <circle cx="200" cy="200" r="46" fill="#f9c013" stroke="#93cc45" stroke-width="4"/>

  <!-- Поділ диска на часточки (як у цитрусовому плоді) -->
  <g stroke="#93cc45" stroke-width="3" stroke-linecap="round">
    <line x1="200" y1="200" x2="200.0" y2="154.0"/>
    <line x1="200" y1="200" x2="232.5" y2="167.5"/>
    <line x1="200" y1="200" x2="246.0" y2="200.0"/>
    <line x1="200" y1="200" x2="232.5" y2="232.5"/>
    <line x1="200" y1="200" x2="200.0" y2="246.0"/>
    <line x1="200" y1="200" x2="167.5" y2="232.5"/>
    <line x1="200" y1="200" x2="154.0" y2="200.0"/>
    <line x1="200" y1="200" x2="167.5" y2="167.5"/>
  </g>
</svg>
